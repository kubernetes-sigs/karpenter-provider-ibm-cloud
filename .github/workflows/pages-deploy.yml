name: Deploy Documentation and Helm Charts to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'charts/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: '4.3.0'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs and dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build

      - name: Package Helm charts
        run: |
          mkdir -p _helm-repo

          curl --fail --silent --show-error https://karpenter-ibm.sh/index.yaml -o _helm-repo/old-index.yaml
          python3 - <<'PY'
          import hashlib, pathlib, urllib.parse, urllib.request, yaml
          directory = pathlib.Path('_helm-repo')
          index = yaml.safe_load((directory / 'old-index.yaml').read_text())
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for versions in index['entries'].values():
              for version in versions:
                  for url in version['urls']:
                      parsed = urllib.parse.urlsplit(urllib.parse.urljoin('https://karpenter-ibm.sh/', url))
                      name = pathlib.PurePosixPath(parsed.path).name
                      if parsed.scheme != 'https' or parsed.netloc != 'karpenter-ibm.sh' or parsed.path != '/' + name or not name.endswith('.tgz') or parsed.query or parsed.fragment or '%' in name:
                          raise ValueError('unexpected chart archive URL')
                      with opener.open(parsed.geturl(), timeout=60) as response:
                          archive = response.read()
                      if hashlib.sha256(archive).hexdigest() != version['digest']:
                          raise ValueError('chart archive digest mismatch')
                      target = directory / name
                      if target.exists() and target.read_bytes() != archive:
                          raise ValueError('conflicting chart archives share a filename')
                      target.write_bytes(archive)
          PY
          helm package charts/ --destination _helm-new
          python3 - <<'PY'
          import hashlib, pathlib, tarfile
          def contents(path):
              with tarfile.open(path) as archive:
                  return sorted((entry.name, entry.type, entry.linkname, entry.mode,
                                 hashlib.sha256(archive.extractfile(entry).read()).hexdigest() if entry.isfile() else '')
                                for entry in archive.getmembers() if not entry.isdir())
          for source in pathlib.Path('_helm-new').glob('*.tgz'):
              target = pathlib.Path('_helm-repo') / source.name
              if target.exists():
                  if contents(target) != contents(source):
                      raise ValueError('chart version already published; bump Chart.yaml')
              else:
                  target.write_bytes(source.read_bytes())
          PY

          if [ -f "_helm-repo/old-index.yaml" ] && [ -s "_helm-repo/old-index.yaml" ]; then
            echo "Merging with existing index..."
            helm repo index _helm-repo --url https://karpenter-ibm.sh --merge _helm-repo/old-index.yaml
          else
            echo "Creating new index..."
            helm repo index _helm-repo --url https://karpenter-ibm.sh
          fi

          rm -f _helm-repo/old-index.yaml

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp _helm-repo/*.tgz _site/
          cp _helm-repo/index.yaml _site/
          cp docs/CNAME _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
