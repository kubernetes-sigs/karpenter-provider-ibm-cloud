name: Go Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'charts/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'charts/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.26'
        cache: true

    - name: Install controller-gen
      run: |
        go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
        mkdir -p ~/.local/share/go/bin
        mv ~/go/bin/controller-gen ~/.local/share/go/bin/

    - name: Install mockgen
      run: |
        go install github.com/golang/mock/mockgen@v1.6.0

    - name: Verify vendor is up to date
      run: |
        make vendor
        git diff --exit-code vendor/ go.sum || \
          (echo "Error: Vendor directory is out of date. Run 'make vendor' and commit the changes." && exit 1)

    - name: Verify mocks are up to date
      run: |
        make gen-mocks
        git diff --exit-code pkg/providers/common/types/mock/ pkg/cloudprovider/ibm/mock/ pkg/providers/common/pricing/mock/ || \
          (echo "Error: Generated mocks are out of date. Run 'make gen-mocks' and commit the changes." && exit 1)

    - name: Verify generated code is up to date
      run: |
        make generate
        git diff --exit-code pkg/apis/ charts/crds/ || \
          (echo "Error: Generated code (CRDs/deepcopy) is out of date. Run 'make generate' and commit the changes." && exit 1)

    - name: Run tests
      run: |
        go test -v -race ./...

    - name: Test API module
      working-directory: pkg/apis
      run: go test -race ./...

    - name: Test E2E harness helpers
      run: env -u RUN_E2E_TESTS go test -mod=vendor -race -tags=e2e ./test/e2e

    - name: Run tests with coverage
      run: |
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.26'
        cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '20'

    - name: Install pre-commit and dependencies
      run: |
        # Install pre-commit
        pip install pre-commit

        # Install shellcheck (already available in ubuntu-latest)
        which shellcheck || sudo apt-get install -y shellcheck

        # Install markdownlint-cli
        npm install -g markdownlint-cli

    - name: Install mockgen
      run: |
        go install go.uber.org/mock/mockgen@v0.6.0

    - name: Generate mocks
      run: make gen-mocks

    - name: Run make lint
      run: |
        # Skip verify-codegen and verify-vendor hooks - already checked in test job
        SKIP=verify-codegen,verify-vendor make lint

    - name: Lint E2E harness
      run: pre-commit run --hook-stage manual golangci-lint-e2e --all-files
