name: E2E Tests (In-Cluster Runner)

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run performance benchmarks
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    types: [labeled]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'run-e2e' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/build-image.yaml
    with:
      tag: e2e-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
      platforms: linux/amd64
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  e2e-tests:
    needs: [build]
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-tests
      cancel-in-progress: false
    timeout-minutes: 360
    container:
      image: golang:1.26
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      KUBECONFIG: /tmp/kubeconfig
      RUN_E2E_TESTS: "true"
      IBMCLOUD_API_KEY: ${{ secrets.IBMCLOUD_API_KEY }}
      VPC_API_KEY: ${{ secrets.IBMCLOUD_API_KEY }}
      IBMCLOUD_REGION: ${{ secrets.IBMCLOUD_REGION }}
      TEST_VPC_ID: ${{ secrets.E2E_TEST_VPC_ID }}
      TEST_SUBNET_ID: ${{ secrets.E2E_TEST_SUBNET_ID }}
      TEST_SUBNETS: ${{ secrets.E2E_TEST_SUBNETS }}
      TEST_IMAGE_ID: ${{ secrets.E2E_TEST_IMAGE_ID }}
      TEST_ZONE: ${{ secrets.E2E_TEST_ZONE }}
      TEST_SECURITY_GROUP_ID: ${{ secrets.E2E_TEST_SECURITY_GROUP_ID }}
      VPC_URL: ${{ secrets.VPC_URL }}
      KUBERNETES_API_SERVER_ENDPOINT: ${{ secrets.KUBERNETES_API_SERVER_ENDPOINT }}
      IBM_RESOURCE_GROUP_ID: ${{ secrets.IBM_RESOURCE_GROUP_ID }}
      IBM_SSH_KEY_ID: ${{ secrets.IBM_SSH_KEY_ID }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl jq
          curl -fsSLO https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Setup kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > "$KUBECONFIG"
          kubectl cluster-info

      - name: Compile and discover E2E tests
        run: |
          mkdir -p test-artifacts
          go test -mod=vendor -p 2 -tags=e2e -c -o e2e.test ./test/e2e
          ./e2e.test -test.list='^TestE2E' | sed -n '/^TestE2E[A-Za-z0-9_]*$/p' > test-artifacts/tests.txt
          test -s test-artifacts/tests.txt

      - name: Deploy tested image and save original identity
        id: deploy
        env:
          TEST_IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          [[ "$TEST_IMAGE" =~ ^quay\.io/karpenter-provider-ibm-cloud/controller@sha256:[0-9a-f]{64}$ ]]
          kubectl get deployment karpenter-karpenter-ibm -n karpenter -o json > test-artifacts/controller-before.json
          jq -e '.spec.template.spec.containers | length == 1' test-artifacts/controller-before.json
          controller_namespace=$(jq -er '.metadata.namespace' test-artifacts/controller-before.json)
          controller_sa=$(jq -er '.spec.template.spec.serviceAccountName // "default"' test-artifacts/controller-before.json)
          while read -r group resource verbs namespace subresource name; do
            for verb in ${verbs//,/ }; do
              review=$(jq -nc --arg sa "$controller_sa" --arg ns "$controller_namespace" --arg group "$group" --arg resource "$resource" --arg verb "$verb" --arg namespace "$namespace" --arg subresource "$subresource" --arg name "$name" '{apiVersion:"authorization.k8s.io/v1",kind:"SubjectAccessReview",spec:{user:("system:serviceaccount:"+$ns+":"+$sa),groups:["system:serviceaccounts",("system:serviceaccounts:"+$ns),"system:authenticated"],resourceAttributes:({group:$group,resource:$resource,verb:$verb,namespace:$namespace,subresource:$subresource,name:$name}|with_entries(select(.value != "-")))}}')
              if ! printf '%s\n' "$review" | kubectl create -f - -o json | jq -e '.status.allowed == true and (.status.evaluationError // "") == ""' > /dev/null; then
                echo "::error::Install matching chart RBAC before E2E: $controller_namespace/$controller_sa requires $verb $group/$resource namespace=$namespace subresource=$subresource name=$name" >&2
                exit 1
              fi
            done
          done <<'PERMISSIONS'
          certificates.k8s.io certificatesigningrequests create,get,list,watch - - -
          certificates.k8s.io certificatesigningrequests patch,update - approval -
          certificates.k8s.io certificatesigningrequests create - nodeclient -
          certificates.k8s.io certificatesigningrequests create - selfnodeclient -
          certificates.k8s.io signers approve - - kubernetes.io/kube-apiserver-client-kubelet
          certificates.k8s.io signers approve - - kubernetes.io/kubelet-serving
          authorization.k8s.io subjectaccessreviews create - - -
          - secrets get,list,create,delete kube-system - -
          - configmaps get,list,watch,create,update,patch,delete kube-system - -
          rbac.authorization.k8s.io roles get,create,update,patch,delete kube-system - -
          rbac.authorization.k8s.io rolebindings get,create,update,patch,delete kube-system - -
          rbac.authorization.k8s.io clusterrolebindings get,create,update,delete - - -
          - events create,patch - - -
          events.k8s.io events create,patch - - -
          PERMISSIONS
          kubectl get ibmnodeclasses,nodeclaims,nodes -o json | jq -S '[.items[] | {uid: .metadata.uid, state: ((.metadata.annotations // {}) | with_entries(select(.key | startswith("karpenter-ibm.sh/") or . == "loadbalancer.ibm.sh/targets")))} | select(.state | length > 0)] | sort_by(.uid)' > test-artifacts/state-before.json
          kubectl get configmaps -n karpenter -o json | jq -S '[.items[] | select(.metadata.name | test("^(iks-pool|vpc-zones)-[0-9a-f]{40}$")) | select(if (.metadata.name | startswith("vpc-zones-")) then (.data.reservations | fromjson | if (.claims | type) != "object" then error("invalid reservations") else (.claims | length > 0) end) else true end) | {uid: .metadata.uid, data: .data}] | sort_by(.uid)' > test-artifacts/reservations-before.json
          kubectl apply -f charts/crds/
          jq --arg image "$TEST_IMAGE" '[{op:"test",path:"/metadata/uid",value:.metadata.uid},{op:"test",path:"/spec/template/spec/containers/0/name",value:.spec.template.spec.containers[0].name},{op:"test",path:"/spec/template/spec/containers/0/image",value:.spec.template.spec.containers[0].image},{op:"replace",path:"/spec/template/spec/containers/0/image",value:$image}]' test-artifacts/controller-before.json > test-artifacts/deploy-patch.json
          echo "image_changed=true" >> "$GITHUB_OUTPUT"
          kubectl patch deployment karpenter-karpenter-ibm -n karpenter --type=json --patch-file=test-artifacts/deploy-patch.json
          kubectl rollout status deployment/karpenter-karpenter-ibm -n karpenter --timeout=300s

      - name: Run discovered E2E tests sequentially
        run: |
          passed=0
          skipped=0
          failed=0
          while IFS= read -r test_case; do
            log="test-artifacts/$test_case.jsonl"
            if go tool test2json -t -p e2e ./e2e.test -test.v -test.count=1 -test.run="^$test_case$" -test.timeout=35m > "$log" 2>&1; then
              if jq -se --arg name "$test_case" 'any(.Test == $name and .Action == "run") and any(.Test == $name and .Action == "pass")' "$log" > /dev/null; then
                passed=$((passed + 1))
                echo "$test_case: PASS"
              elif jq -se --arg name "$test_case" 'any(.Test == $name and .Action == "run") and any(.Test == $name and .Action == "skip")' "$log" > /dev/null; then
                skipped=$((skipped + 1))
                echo "$test_case: SKIP"
              else
                failed=$((failed + 1))
                echo "$test_case: FAIL (missing result)"
              fi
            else
              failed=$((failed + 1))
              echo "$test_case: FAIL"
            fi
          done < test-artifacts/tests.txt
          echo "Passed: $passed; skipped: $skipped; failed: $failed" | tee test-artifacts/summary.txt
          test "$failed" -eq 0 && test "$passed" -gt 0

      - name: Run requested benchmarks
        if: inputs.run_benchmarks
        env:
          RUN_E2E_BENCHMARKS: 'true'
        run: go tool test2json -t -p e2e ./e2e.test -test.v -test.run='^$' -test.bench=BenchmarkE2E -test.benchtime=1x -test.timeout=30m > test-artifacts/benchmarks.jsonl

      - name: Clean owned E2E resources
        id: cleanup
        if: always() && steps.deploy.outputs.image_changed == 'true'
        run: |
          go tool test2json -t -p e2e ./e2e.test -test.v -test.count=1 -test.run='^TestCleanupE2EEnvironment$' -test.timeout=45m > test-artifacts/cleanup.jsonl 2>&1
          jq -se 'any(.Test == "TestCleanupE2EEnvironment" and .Action == "run") and any(.Test == "TestCleanupE2EEnvironment" and .Action == "pass")' test-artifacts/cleanup.jsonl
          echo "succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Restore original image after cleanup
        if: always() && steps.deploy.outputs.image_changed == 'true'
        env:
          CLEANUP_SUCCEEDED: ${{ steps.cleanup.outputs.succeeded }}
          TEST_IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          test "$CLEANUP_SUCCEEDED" = true
          kubectl get ibmnodeclasses,nodeclaims,nodes -o json | jq -S '[.items[] | {uid: .metadata.uid, state: ((.metadata.annotations // {}) | with_entries(select(.key | startswith("karpenter-ibm.sh/") or . == "loadbalancer.ibm.sh/targets")))} | select(.state | length > 0)] | sort_by(.uid)' > test-artifacts/state-after.json
          kubectl get configmaps -n karpenter -o json | jq -S '[.items[] | select(.metadata.name | test("^(iks-pool|vpc-zones)-[0-9a-f]{40}$")) | select(if (.metadata.name | startswith("vpc-zones-")) then (.data.reservations | fromjson | if (.claims | type) != "object" then error("invalid reservations") else (.claims | length > 0) end) else true end) | {uid: .metadata.uid, data: .data}] | sort_by(.uid)' > test-artifacts/reservations-after.json
          jq -ne --slurpfile before test-artifacts/state-before.json --slurpfile after test-artifacts/state-after.json 'all($after[0][]; . as $record | any($before[0][]; . == $record))'
          jq -ne --slurpfile before test-artifacts/reservations-before.json --slurpfile after test-artifacts/reservations-after.json 'all($after[0][]; . as $record | any($before[0][]; . == $record))'
          jq --arg image "$TEST_IMAGE" '[{op:"test",path:"/metadata/uid",value:.metadata.uid},{op:"test",path:"/spec/template/spec/containers/0/name",value:.spec.template.spec.containers[0].name},{op:"test",path:"/spec/template/spec/containers/0/image",value:$image},{op:"replace",path:"/spec/template/spec/containers/0/image",value:.spec.template.spec.containers[0].image}]' test-artifacts/controller-before.json > test-artifacts/restore-patch.json
          kubectl patch deployment karpenter-karpenter-ibm -n karpenter --type=json --patch-file=test-artifacts/restore-patch.json
          kubectl rollout status deployment/karpenter-karpenter-ibm -n karpenter --timeout=300s

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-test-artifacts-${{ github.run_id }}
          path: test-artifacts/
          retention-days: 7

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"
