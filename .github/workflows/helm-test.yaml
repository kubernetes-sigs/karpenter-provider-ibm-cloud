name: Test Helm Chart

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'hack/test-helm-rbac.py'
      - 'hack/test-prometheus-rules.sh'
      - 'test/metrics/**'
      - 'Makefile'
      - '.github/workflows/helm-test.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'hack/test-helm-rbac.py'
      - 'hack/test-prometheus-rules.sh'
      - 'test/metrics/**'
      - 'Makefile'
      - '.github/workflows/helm-test.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install Helm
      id: install-helm
      run: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod +x get_helm.sh
        ./get_helm.sh

    - name: Create test values
      id: create-test-values
      run: |
        cat > charts/ci-values.yaml << EOF
        credentials:
          ibmApiKey: "ci-test-key"
          region: "us-south"
          vpcApiKey: "ci-test-vpc-key"
          vpcUrl: "https://us-south.iaas.cloud.ibm.com/v1"
        additionalCAs:
          enabled: true
          certs:
            cluster-ca: |
              -----BEGIN CERTIFICATE-----
              CI TEST CA
              -----END CERTIFICATE-----
        EOF

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'

    - name: Verify RBAC references
      run: |
        python3 -m pip install PyYAML==6.0.2
        make test-rbac

    - name: Test Prometheus alerts
      env:
        PROMETHEUS_VERSION: 3.15.0
        PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      run: |
        archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
        curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
        echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum -c -
        tar xzf "${archive}" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
        PATH="$PWD:$PATH" make test-alerts

    - name: Create yamllint config
      id: create-yamllint-config
      run: |
        cat > .yamllint << EOF
        extends: default
        rules:
          document-start: disable
          line-length: disable
        EOF

    - name: Run tests
      id: run-tests
      working-directory: charts
      run: |
        # Lint chart with test values
        helm lint . -f ci-values.yaml

        # Validate template rendering
        helm template . -f ci-values.yaml > rendered.yaml
        grep -q 'name: ca_crt' rendered.yaml
        grep -q 'key: ca_crt' rendered.yaml
