credentials:
  ibmApiKey: ''
  vpcApiKey: ''
  region: us-south
clusterName: my-vpc-cluster
bootstrapMode: cloud-init
customResources:
  enabled: true
  mode: vpc
  global:
    instanceTypes:
    - bx2-2x8
    - bx2-4x16
    - bx2-8x32
    capacityType: on-demand
    architecture: amd64
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 30s
      expireAfter: 720h
    limits:
      cpu: 1000
      memory: 1000Gi
  nodeClass:
    enabled: true
    name: vpc-nodeclass
    spec:
      region: us-south
      vpc: r010-12345678-1234-5678-9abc-def012345678
      resourceGroup: replace-with-resource-group-id
      apiServerEndpoint: https://10.0.0.1:6443
      bootstrapMode: cloud-init
      imageSelector:
        os: ubuntu
        majorVersion: '24'
        minorVersion: '04'
        architecture: amd64
      placementStrategy:
        zoneBalance: Balanced
        subnetSelection:
          minimumAvailableIPs: 10
      blockDeviceMappings:
      - rootVolume: true
        volumeSpec:
          capacity: 100
          profile: general-purpose
  nodePools:
  - name: general-purpose
    enabled: true
    requirements:
      instanceTypes:
      - bx2-2x8
      - bx2-4x16
      capacityType: on-demand
      architecture: amd64
    limits:
      cpu: 100
      memory: 100Gi
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 30s
      expireAfter: 720h
    labels:
      nodepool: general-purpose
      workload-type: general
  - name: spot-batch
    enabled: true
    requirements:
      instanceTypes:
      - bx2-4x16
      - bx2-8x32
      capacityType: spot
      architecture: amd64
    limits:
      cpu: 200
      memory: 200Gi
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 300s
      expireAfter: 12h
    taints:
    - key: node.kubernetes.io/instance-type
      value: spot
      effect: NoSchedule
    labels:
      nodepool: spot-batch
      workload-type: batch
      cost-optimization: enabled
  - name: high-memory
    enabled: false
    requirements:
      instanceTypes:
      - mx2-8x64
      - mx2-16x128
      capacityType: on-demand
      architecture: amd64
    limits:
      cpu: 50
      memory: 500Gi
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 60s
      expireAfter: 168h
    taints:
    - key: workload-type
      value: high-memory
      effect: NoSchedule
    labels:
      nodepool: high-memory
      workload-type: memory-intensive
controller:
  metrics:
    port: 8080
  healthProbe:
    port: 8081
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      monitoring: prometheus
    interval: 30s
    scrapeTimeout: 10s
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
