credentials:
  ibmApiKey: ''
  vpcApiKey: ''
  region: us-south
clusterName: my-iks-cluster
bootstrapMode: iks-api
customResources:
  enabled: true
  mode: iks
  global:
    instanceTypes:
    - bx2-4x16
    capacityType: on-demand
    architecture: amd64
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 60s
      expireAfter: 720h
    limits:
      cpu: 500
      memory: 500Gi
  nodeClass:
    enabled: true
    name: iks-nodeclass
    spec:
      region: us-south
      vpc: r010-12345678-1234-5678-9abc-def012345678
      resourceGroup: replace-with-resource-group-id
      apiServerEndpoint: https://10.0.0.1:6443
      bootstrapMode: iks-api
      iksClusterID: replacewithclusterid
      zone: us-south-1
      subnet: 0717-12345678-1234-5678-9abc-def012345678
      instanceProfile: bx2-4x16
      iksDynamicPools:
        enabled: true
        namePrefix: karp
        allowedInstanceTypes:
        - bx2-4x16
  nodePools:
  - name: iks-general
    enabled: true
    requirements:
      instanceTypes:
      - bx2-4x16
      capacityType: on-demand
      architecture: amd64
    limits:
      cpu: 100
      memory: 100Gi
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 120s
      expireAfter: 720h
    labels:
      nodepool: iks-general
      workload-type: general
      platform: iks
  - name: iks-compute
    enabled: false
    requirements:
      instanceTypes:
      - bx2-4x16
      capacityType: on-demand
      architecture: amd64
    limits:
      cpu: 200
      memory: 200Gi
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 300s
      expireAfter: 168h
    taints:
    - key: workload-type
      value: compute-intensive
      effect: NoSchedule
    labels:
      nodepool: iks-compute
      workload-type: compute-intensive
      platform: iks
controller:
  metrics:
    port: 8080
  healthProbe:
    port: 8081
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      monitoring: prometheus
    interval: 60s
    scrapeTimeout: 15s
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
